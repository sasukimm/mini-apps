<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#17324d"><title>會話底線句子訓練</title>
<style>
*{box-sizing:border-box}:root{--navy:#17324d;--blue:#2563eb;--ink:#1f2937;--muted:#64748b;--line:#dce5ef;--green:#16835c;--red:#c2414b}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#edf4fb,#f8fafc 38%,#fff);color:var(--ink)}
.home-fab{position:fixed;top:16px;left:16px;z-index:999;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#ffffffee;color:var(--navy);border:1px solid #dbe4ee;text-decoration:none;font-weight:800;box-shadow:0 8px 24px #0f172a24;backdrop-filter:blur(10px)}
.app{max-width:960px;margin:auto;padding:42px 20px 60px}.hero{background:linear-gradient(135deg,#17324d,#24547e);color:white;border-radius:28px;padding:30px;box-shadow:0 18px 45px #17324d33}.hero-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px)}.hero p{margin:0;color:#dce9f5;line-height:1.6}.counter{white-space:nowrap;background:#ffffff19;border:1px solid #ffffff33;border-radius:16px;padding:11px 14px;font-weight:800}
.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 8px 24px #0f172a0b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.label{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 9px;text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;cursor:pointer}.chip{border:1px solid var(--line);background:white;color:#475569;padding:9px 13px;border-radius:999px;font-weight:750}.chip.active{background:var(--navy);border-color:var(--navy);color:white}.mode-btn{flex:1;min-width:155px;border:1px solid var(--line);background:#f8fafc;padding:15px;border-radius:16px;text-align:left}.mode-btn strong{display:block;color:var(--navy);margin-bottom:3px}.mode-btn span{font-size:13px;color:var(--muted)}.mode-btn.active{border-color:#7ba9d3;background:#eef6ff;box-shadow:0 0 0 3px #dbeafe}
.study{min-height:390px;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:14px}.lesson-tag{display:inline-flex;background:#e8f1fa;color:var(--navy);padding:7px 11px;border-radius:999px;font-weight:800}.progress{height:9px;background:#e7edf4;border-radius:999px;overflow:hidden;margin-top:14px}.bar{height:100%;background:linear-gradient(90deg,#5790c5,#2563eb);transition:width .2s}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px 10px}.context{color:var(--muted);margin-bottom:15px;line-height:1.55}.zh{font-size:clamp(20px,4vw,30px);font-weight:800;line-height:1.5}.jp{font-size:clamp(24px,5vw,38px);font-weight:850;line-height:1.55;letter-spacing:.02em;color:var(--navy)}.blank{display:inline-block;min-width:110px;border-bottom:4px solid #7ba9d3;color:transparent;margin:0 4px}
.answer-area{max-width:720px;margin:20px auto 0;width:100%}.answer-input{width:100%;border:2px solid #cbd5e1;border-radius:16px;padding:15px;font-size:20px;text-align:center;outline:none}.answer-input:focus{border-color:#5790c5;box-shadow:0 0 0 4px #dbeafe}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}.primary,.secondary,.good,.bad{border:0;border-radius:13px;padding:12px 18px;font-weight:800}.primary{background:var(--blue);color:white}.secondary{background:#eef2f7;color:#475569}.good{background:#e6f6ef;color:var(--green)}.bad{background:#fff0f1;color:var(--red)}
.feedback{margin:14px auto 0;max-width:720px;border-radius:15px;padding:13px 15px;line-height:1.55}.feedback.ok{background:#eaf8f1;color:#116149}.feedback.no{background:#fff0f1;color:#9f2733}.hidden{display:none!important}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f8fafc;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
@media(max-width:600px){.home-fab{top:10px;left:10px}.app{padding:66px 12px 35px}.hero{padding:22px 18px}.hero-top{display:block}.counter{display:inline-block;margin-top:15px}.panel{padding:15px}.study{min-height:430px}.footer-nav button{flex:1}.jp{font-size:26px}.zh{font-size:21px}}
</style></head><body><a class="home-fab" href="index.html">⌂ <span>首頁</span></a><main class="app">
<section class="hero"><div class="hero-top"><div><h1>🗣️ 會話底線句子訓練</h1><p>第9–12課老師指定句子。由「認得」逐步練到「完整默寫」，每個助詞和語尾都要準確。</p></div><div class="counter" id="counter">1 / 21</div></div></section>
<section class="panel"><div class="label">選擇課堂</div><div class="row" id="lessonFilters"></div><div class="label" style="margin-top:18px">練習模式</div><div class="row"><button class="mode-btn active" data-mode="card"><strong>① 記憶卡</strong><span>中文／情境 → 精確日文</span></button><button class="mode-btn" data-mode="blank"><strong>② 重點填空</strong><span>補回容易遺漏的詞組</span></button><button class="mode-btn" data-mode="typing"><strong>③ 完整默寫</strong><span>輸入整句，逐字核對</span></button></div></section>
<section class="panel study"><div class="meta"><span class="lesson-tag" id="lessonTag"></span><span id="statusText"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="prompt"><div class="context" id="context"></div><div class="zh" id="zh"></div><div class="jp hidden" id="jp"></div><div class="answer-area hidden" id="answerArea"><input class="answer-input" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="請輸入日文答案"><div class="actions"><button class="primary" id="checkBtn">檢查答案</button><button class="secondary" id="showBtn">顯示答案</button></div><div id="feedback" class="feedback hidden"></div></div></div><div class="actions" id="cardActions"><button class="primary" id="revealBtn">顯示日文答案</button><button class="bad hidden" id="wrongBtn">✕ 還未記熟</button><button class="good hidden" id="correctBtn">✓ 已記熟</button></div><div class="footer-nav"><button class="secondary" id="prevBtn">← 上一句</button><button class="secondary" id="shuffleBtn">🔀 隨機</button><button class="primary" id="nextBtn">下一句 →</button></div><div class="stats"><div class="stat"><b id="mastered">0</b><span>已記熟</span></div><div class="stat"><b id="learning">0</b><span>需重溫</span></div><div class="stat"><b id="accuracy">0%</b><span>標記正確率</span></div></div></section></main>
<script>
const items=[{"lesson": 9, "jp": "どこが違うんですか。", "zh": "哪裏不同呢？", "context": "比較兩本電子辭典時詢問差異", "blank": "違うんですか"}, {"lesson": 9, "jp": "意味の説明だけじゃなくて、例文がたくさん載っているのが欲しいんです。", "zh": "我想要的不只是意思說明，而是載有很多例句的。", "context": "解釋自己想要哪一種辭典", "blank": "だけじゃなくて"}, {"lesson": 9, "jp": "ほかにいいの、ありませんか。", "zh": "還有其他更好的嗎？", "context": "詢問是否有其他選擇", "blank": "ほかに"}, {"lesson": 9, "jp": "機能はフラット社のと", "zh": "功能方面，和 Flat 公司的……", "context": "比較兩間公司的產品（前半句）", "blank": "フラット社のと"}, {"lesson": 9, "jp": "比べると、どうですか。", "zh": "比較起來怎麼樣？", "context": "接續上一句作比較（後半句）", "blank": "比べると"}, {"lesson": 9, "jp": "そのトップ社ので、", "zh": "在那款 Top 公司的產品之中……", "context": "指定剛才提及的 Top 公司產品", "blank": "そのトップ社ので"}, {"lesson": 10, "jp": "どういうことでしょうか。", "zh": "這是甚麼意思呢？／怎麼回事呢？", "context": "不明白對方說法時禮貌追問", "blank": "どういうこと"}, {"lesson": 10, "jp": "そんなはずはありません。", "zh": "不可能有那回事。", "context": "強烈否定對方的推測", "blank": "はずはありません"}, {"lesson": 10, "jp": "てっきりワットさんのだと思って……。", "zh": "我一直以為一定是 Watt 先生的……", "context": "說明自己誤會的原因", "blank": "てっきり"}, {"lesson": 10, "jp": "わかってもらえればいいんです。", "zh": "只要你明白就好了。", "context": "接受對方道歉並表示不介意", "blank": "もらえれば"}, {"lesson": 11, "jp": "どこかお勧めのところ、ありませんか。", "zh": "有沒有甚麼值得推薦的地方？", "context": "詢問暑假旅遊地點", "blank": "お勧めのところ"}, {"lesson": 11, "jp": "沖縄っていうのはどう？", "zh": "沖繩怎麼樣？", "context": "以口語方式提出一個建議", "blank": "っていうのは"}, {"lesson": 11, "jp": "それも悪くないですね。", "zh": "那個也不錯呢。", "context": "回應對方提出的沖繩建議", "blank": "悪くない"}, {"lesson": 11, "jp": "それもそうですね。", "zh": "那也說得對呢。", "context": "同意對方關於冬天去北海道的看法", "blank": "それもそう"}, {"lesson": 11, "jp": "利用したらどう？", "zh": "利用它怎麼樣？", "context": "建議使用套裝旅行團", "blank": "したらどう"}, {"lesson": 12, "jp": "そうなんですか。", "zh": "是這樣嗎？", "context": "得知鄰居投訴後的反應", "blank": "そうなんですか"}, {"lesson": 12, "jp": "気がつきませんでした。", "zh": "我沒有留意到。", "context": "承認不知道洗衣機聲音造成滋擾", "blank": "気がつきませんでした"}, {"lesson": 12, "jp": "思わなかったものですから。", "zh": "因為我沒想到會這樣。", "context": "解釋沒想到聲音會傳到樓下", "blank": "ものですから"}, {"lesson": 12, "jp": "どうしても", "zh": "無論如何也……／怎樣也……", "context": "因為加班，做家務總是拖到晚上", "blank": "どうしても"}, {"lesson": 12, "jp": "あまり遅い時間に洗濯されると", "zh": "如果在太晚的時間洗衣服的話……", "context": "鄰居委婉提出困擾", "blank": "洗濯されると"}, {"lesson": 12, "jp": "ご迷惑をかけてすみませんでした。", "zh": "給你添麻煩，真的很抱歉。", "context": "最後正式向鄰居道歉", "blank": "ご迷惑をかけて"}];const KEY="jp_underlined_conversation_v1";let state={lesson:"all",mode:"card",pos:0,statuses:{},order:items.map((_,i)=>i)};try{const s=JSON.parse(localStorage.getItem(KEY));if(s)state={...state,...s}}catch(e){}
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function list(){return state.order.filter(i=>state.lesson==="all"||items[i].lesson===Number(state.lesson))}function currentIndex(){const a=list();if(!a.length)return 0;if(state.pos>=a.length)state.pos=0;return a[state.pos]}function norm(s){return String(s).normalize("NFKC").replace(/[、。，．！？!?…・\s]/g,"").replace(/〜/g,"～")}function blanked(it){const i=it.jp.indexOf(it.blank);if(i<0)return it.jp;return it.jp.slice(0,i)+'<span class="blank">'+it.blank+'</span>'+it.jp.slice(i+it.blank.length)}
function filters(){const e=$("lessonFilters");e.innerHTML="";["all",9,10,11,12].forEach(v=>{const b=document.createElement("button");b.className="chip"+(String(state.lesson)===String(v)?" active":"");b.textContent=v==="all"?"全部":`第${v}課`;b.onclick=()=>{state.lesson=String(v);state.pos=0;render()};e.appendChild(b)})}
function render(){filters();document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));const a=list(),idx=currentIndex(),it=items[idx];$("counter").textContent=`${a.length?state.pos+1:0} / ${a.length}`;$("lessonTag").textContent=`第${it.lesson}課`;$("statusText").textContent=state.statuses[idx]==="correct"?"✓ 已記熟":state.statuses[idx]==="wrong"?"需重溫":"尚未標記";$("bar").style.width=`${a.length?(state.pos+1)/a.length*100:0}%`;$("context").textContent=it.context;$("zh").textContent=it.zh;$("jp").textContent=it.jp;$("jp").classList.add("hidden");$("answerArea").classList.add("hidden");$("cardActions").classList.add("hidden");$("feedback").className="feedback hidden";$("answerInput").value="";
if(state.mode==="card"){$("cardActions").classList.remove("hidden");$("revealBtn").classList.remove("hidden");$("wrongBtn").classList.add("hidden");$("correctBtn").classList.add("hidden")}else{$("answerArea").classList.remove("hidden");$("zh").innerHTML=state.mode==="blank"?blanked(it):it.zh;$("answerInput").placeholder=state.mode==="blank"?"輸入底線中遺漏的詞組":"輸入完整日文句子"}
const v=Object.values(state.statuses),c=v.filter(x=>x==="correct").length,w=v.filter(x=>x==="wrong").length;$("mastered").textContent=c;$("learning").textContent=w;$("accuracy").textContent=c+w?Math.round(c/(c+w)*100)+"%":"0%";save()}
function move(n){const a=list();if(a.length)state.pos=(state.pos+n+a.length)%a.length;render()}
$("revealBtn").onclick=()=>{$("jp").classList.remove("hidden");$("revealBtn").classList.add("hidden");$("wrongBtn").classList.remove("hidden");$("correctBtn").classList.remove("hidden")};$("correctBtn").onclick=()=>{state.statuses[currentIndex()]="correct";move(1)};$("wrongBtn").onclick=()=>{state.statuses[currentIndex()]="wrong";move(1)};
$("checkBtn").onclick=()=>{const it=items[currentIndex()],expected=state.mode==="blank"?it.blank:it.jp,ok=norm($("answerInput").value)===norm(expected),f=$("feedback");f.className="feedback "+(ok?"ok":"no");f.innerHTML=ok?"✓ 完全正確！":`✕ 正確答案：<strong>${expected}</strong>`;state.statuses[currentIndex()]=ok?"correct":"wrong";save()};$("showBtn").onclick=()=>{const it=items[currentIndex()],expected=state.mode==="blank"?it.blank:it.jp,f=$("feedback");f.className="feedback no";f.innerHTML=`答案：<strong>${expected}</strong>`;state.statuses[currentIndex()]="wrong";save()};
$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);$("shuffleBtn").onclick=()=>{for(let i=state.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}state.pos=0;render()};document.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.pos=0;render()});$("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("checkBtn").click()});render();
</script></body></html>
