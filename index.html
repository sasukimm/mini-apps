<title>Japanese Study Mini Apps</title>
<style>
*{box-sizing:border-box}

main{max-width:850px;margin:auto;padding:55px 20px}

.icon{font-size:38px}.title{font-size:22px;font-weight:800;margin:12px 0 8px}.desc{color:#64748b;line-height:1.55}

<body>
<main>
  <h1>📚 Japanese Study Mini Apps</h1>
  <div class="subtitle">選擇一組 Flashcards 開始溫習</div>
  <div class="grid">
    <a class="card" href="japanese_flashcards_16.html">
      <div class="icon">🗣️</div>
      <div class="title">擬聲詞／擬態詞</div>
      <div class="desc">16 個詞彙，支援隨機模式、正反向測試及答對／答錯重溫。</div>
    </a>
    <a class="card" href="japanese_flashcards_69.html">
      <div class="icon">🇯🇵</div>
      <div class="title">期終考試生字</div>
      <div class="desc">69 個漢字及片假名詞彙，支援自動保存、隨機模式及答對／答錯重溫。</div>
    </a>
  </div>
  <div class="note">上載整個資料夾內容到 GitHub repository 的根目錄後，GitHub Pages 會以此頁作為首頁。</div>
