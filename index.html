<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JP Study">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Japanese Study Mini Apps</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
      background:#f8fafc;
      color:#1f2937
    }
    main{
      max-width:900px;
      margin:auto;
      padding:50px 20px
    }
    h1{
      font-size:36px;
      margin:0 0 10px
    }
    .subtitle{
      color:#64748b;
      margin-bottom:24px
    }
    .install-area{
      margin-bottom:28px
    }
    .install-btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:16px 20px;
      background:#17324d;
      color:white;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 20px #17324d26
    }
    .install-btn:hover{
      background:#214362
    }
    .install-btn:disabled{
      cursor:default;
      opacity:.7
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:18px
    }
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:white;
      border:1px solid #e2e8f0;
      border-radius:20px;
      padding:24px;
      box-shadow:0 8px 22px #0000000d;
      transition:.2s
    }
    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 28px #00000016
    }
    .icon{font-size:38px}
    .title{
      font-size:22px;
      font-weight:800;
      margin:12px 0 8px
    }
    .desc{
      color:#64748b;
      line-height:1.55
    }
    .quiz{
      border-color:#bfdbfe;
      background:linear-gradient(145deg,#fff,#eff6ff)
    }
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:#0f172a99;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000
    }
    .modal-backdrop.show{
      display:flex
    }
    .modal{
      width:min(430px,100%);
      background:white;
      border-radius:22px;
      padding:24px;
      box-shadow:0 24px 60px #0004
    }
    .modal h2{
      margin:0 0 12px;
      font-size:23px
    }
    .modal p{
      color:#475569;
      line-height:1.65;
      margin:8px 0
    }
    .steps{
      margin:14px 0 0;
      padding-left:22px;
      color:#334155;
      line-height:1.8
    }
    .close-btn{
      width:100%;
      margin-top:20px;
      border:0;
      border-radius:12px;
      padding:12px 16px;
      background:#e2e8f0;
      color:#1f2937;
      font-weight:800;
      cursor:pointer
    }
    @media(max-width:600px){
      main{padding:30px 14px}
      h1{font-size:30px}
    }
  </style>
</head>
<body>
  <main>
    <h1>📚 Japanese Study Mini Apps</h1>
    <div class="subtitle">選擇一個工具開始溫習</div>

    <div class="grid">
      <a class="card quiz" href="japanese_final_quiz.html">
        <div class="icon">📝</div>
        <div class="title">期終考試 Grammar Quiz</div>
        <div class="desc">第9–12課 Part V 之後，共88題。包括練習模式、模擬考試、錯題重溫、即時解釋及作文練習。</div>
      </a>

      <a class="card" href="japanese_grammar_flashcards.html">
        <div class="icon">📖</div>
        <div class="title">期終考試文法 Flashcards</div>
        <div class="desc">第9–12課文法重點，支援例句→解釋、中文用法→文法、按課選擇、隨機模式及答對／答錯重溫。</div>
      </a>

      <a class="card" href="japanese_flashcards_16.html">
        <div class="icon">🗣️</div>
        <div class="title">擬聲詞／擬態詞</div>
        <div class="desc">16個詞彙，支援隨機模式、正反向測試及答對／答錯重溫。</div>
      </a>

      <a class="card" href="japanese_flashcards_69.html">
        <div class="icon">🇯🇵</div>
        <div class="title">期終考試生字</div>
        <div class="desc">69個漢字及片假名詞彙，支援自動保存、隨機模式及答對／答錯重溫。</div>
      </a>
    </div>


    <div class="install-area">
      <button id="installBtn" class="install-btn" type="button">
        📲 安裝 JP Study 到手機
      </button>
    </div>
  </main>

  <div id="installModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <div class="modal">
      <h2 id="installTitle">安裝 JP Study</h2>
      <div id="installInstructions"></div>
      <button id="closeModalBtn" class="close-btn" type="button">關閉</button>
    </div>
  </div>

  <script>
    let deferredPrompt = null;

    const installBtn = document.getElementById("installBtn");
    const modal = document.getElementById("installModal");
    const instructions = document.getElementById("installInstructions");
    const closeModalBtn = document.getElementById("closeModalBtn");

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent);

    function showModal(html) {
      instructions.innerHTML = html;
      modal.classList.add("show");
    }

    function closeModal() {
      modal.classList.remove("show");
    }

    if (isStandalone) {
      installBtn.textContent = "✅ JP Study 已安裝";
      installBtn.disabled = true;
    }

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      if (!isStandalone) {
        installBtn.textContent = "📲 安裝 JP Study 到手機";
        installBtn.disabled = false;
      }
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      installBtn.textContent = "✅ JP Study 已安裝";
      installBtn.disabled = true;
    });

    installBtn.addEventListener("click", async () => {
      if (isStandalone) return;

      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }

      if (isIOS && isSafari) {
        showModal(`
          <p>iPhone／iPad 需要透過 Safari 加入主畫面：</p>
          <ol class="steps">
            <li>按 Safari 底部的「分享」按鈕。</li>
            <li>向下滑並選擇「加入主畫面」。</li>
            <li>確認名稱後按「加入」。</li>
          </ol>
        `);
        return;
      }

      if (isIOS && !isSafari) {
        showModal(`
          <p>請先使用 Safari 開啟這個網站，然後：</p>
          <ol class="steps">
            <li>按 Safari 的「分享」按鈕。</li>
            <li>選擇「加入主畫面」。</li>
            <li>按「加入」完成安裝。</li>
          </ol>
        `);
        return;
      }

      showModal(`
        <p>你的瀏覽器暫時未提供直接安裝提示。</p>
        <p>請打開瀏覽器選單，尋找「安裝應用程式」、「Install app」或「加入主畫面」。</p>
      `);
    });

    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
